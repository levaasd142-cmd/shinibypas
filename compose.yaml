# .env is read by Docker Compose as an env_file: values are taken literally line by line,
# but `$` starts variable interpolation in compose itself — write `$$` for a literal `$`
# in passwords/tokens, or keep such values free of `$`. Do not quote values.
x-shop: &shop
  image: themarket:latest
  build: .
  env_file: .env
  init: true                # tini as PID 1: forwards SIGTERM, reaps zombies
  stop_grace_period: 30s    # time for in-flight deliveries and the database to close cleanly
  restart: unless-stopped
  volumes:
    - shop-data:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  panel:
    <<: *shop
    environment:
      DATABASE_PATH: /app/data/shop.sqlite3
      HOST: 0.0.0.0
      PORT: "8080"
      # uvicorn trusts X-Forwarded-For/-Proto only from these addresses. Behind a reverse proxy on
      # the host, set it to the proxy's address as seen from the container (e.g. the bridge gateway).
      # Never use "*" when the port is reachable by others.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    command: [python, run.py, panel]
    ports:
      # Local only. Publish through an HTTPS reverse proxy; Basic Auth must not travel over plain HTTP.
      - "127.0.0.1:8080:8080"

  bot:
    <<: *shop
    environment:
      DATABASE_PATH: /app/data/shop.sqlite3
    command: [python, run.py, bot]
    # The bot has no HTTP port: healthy while its process runs and the database is readable.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3,sys; sqlite3.connect('file:'+os.environ['DATABASE_PATH']+'?mode=ro',uri=True,timeout=5).execute('SELECT 1').fetchone(); sys.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    profiles: [telegram]

volumes:
  shop-data:
